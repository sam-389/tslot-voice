<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TSLOT — Υπαγόρευση</title>
<style>
  :root { --blue: #1d4ed8; --ink: #172536; --muted: #5b6b80; --line: #cfd8e3; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", Arial, sans-serif; color: var(--ink); background: #f5f8fc; }
  main { max-width: 560px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 18px; margin: 0 0 2px; }
  #what { color: var(--muted); font-size: 14px; margin: 0 0 14px; }
  #mic {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; height: 64px; border: 0; border-radius: 12px; cursor: pointer;
    background: var(--blue); color: #fff; font-size: 20px; font-weight: 600;
  }
  #mic.on { background: #b91c1c; animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .75; } }
  #status { min-height: 20px; font-size: 13px; color: var(--muted); margin: 8px 0; }
  #status.err { color: #b91c1c; font-weight: 600; }
  textarea {
    width: 100%; min-height: 110px; padding: 10px; font: 17px "Segoe UI", Arial, sans-serif;
    border: 1px solid var(--line); border-radius: 8px; background: #fff; resize: vertical;
  }
  .row { display: flex; gap: 8px; margin-top: 10px; }
  .row button { flex: 1; height: 44px; border-radius: 8px; font-size: 15px; cursor: pointer; border: 1px solid var(--line); background: #fff; color: var(--ink); }
  #done { background: #15803d; border-color: #15803d; color: #fff; font-weight: 600; flex: 2; }
  #done:disabled { opacity: .5; cursor: default; }
  .tip { font-size: 12px; color: var(--muted); margin-top: 12px; line-height: 1.4; }
</style>
</head>
<body>
<main>
  <h1>🎙 Υπαγόρευση</h1>
  <p id="what">Μίλησε και έλεγξε το κείμενο πριν πατήσεις «Έτοιμο».</p>

  <button id="mic" type="button">🎙 Πάτα και μίλα</button>
  <div id="status" role="status"></div>

  <textarea id="text" placeholder="Το κείμενο θα εμφανιστεί εδώ. Μπορείς να το διορθώσεις."></textarea>

  <div class="row">
    <button id="clear" type="button">Καθαρισμός</button>
    <button id="cancel" type="button">Άκυρο</button>
    <button id="done" type="button">✓ Έτοιμο</button>
  </div>

  <p class="tip">Η σελίδα κάνει μόνο υπαγόρευση: δεν βλέπει και δεν αποθηκεύει τίποτα.
  Το κείμενο πηγαίνει στη φόρμα της εφαρμογής TSLOT και η αποθήκευση γίνεται από εκεί.</p>
</main>

<script>
(function () {
  'use strict';

  // Παράμετροι από την εφαρμογή TSLOT: ποιο πεδίο, σε ποια σελίδα να επιστρέψει, κωδικός αιτήματος.
  var params = new URLSearchParams(location.search);
  var label = (params.get('label') || '').slice(0, 60);
  var returnOrigin = params.get('o') || '';
  var nonce = params.get('n') || '';
  var start = params.get('t') || '';

  // Επιστρέφουμε κείμενο ΜΟΝΟ σε σελίδες εφαρμογών Google Apps Script.
  var originOk = /^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/.test(returnOrigin);

  var micBtn = document.getElementById('mic');
  var statusEl = document.getElementById('status');
  var textEl = document.getElementById('text');
  var doneBtn = document.getElementById('done');

  if (label) document.getElementById('what').textContent = 'Πεδίο: ' + label + ' — μίλησε και έλεγξε το κείμενο πριν πατήσεις «Έτοιμο».';
  if (start) textEl.value = start.slice(0, 2000);

  function setStatus(msg, isError) {
    statusEl.textContent = msg || '';
    statusEl.className = isError ? 'err' : '';
  }

  if (!window.opener || !originOk || !nonce) {
    doneBtn.disabled = true;
    setStatus('Άνοιξε αυτή τη σελίδα από το κουμπί 🎙 της εφαρμογής TSLOT.', true);
  }

  var Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  var rec = null;
  var listening = false;
  var baseText = '';

  if (!Recognition) {
    micBtn.disabled = true;
    setStatus('Αυτός ο browser δεν υποστηρίζει υπαγόρευση. Άνοιξέ το σε Chrome ή Edge.', true);
  } else {
    rec = new Recognition();
    rec.lang = 'el-GR';
    rec.continuous = true;
    rec.interimResults = true;

    rec.onstart = function () {
      listening = true;
      micBtn.classList.add('on');
      micBtn.textContent = '■ Σταμάτα';
      setStatus('Ακούω… μίλα κανονικά.');
    };
    rec.onend = function () {
      listening = false;
      micBtn.classList.remove('on');
      micBtn.textContent = '🎙 Πάτα και μίλα';
      if (!statusEl.classList.contains('err')) setStatus(textEl.value.trim() ? 'Έλεγξε το κείμενο και πάτα «Έτοιμο».' : '');
    };
    rec.onerror = function (e) {
      var msg = {
        'not-allowed': 'Δεν δόθηκε άδεια για το μικρόφωνο. Πάτα το εικονίδιο 🔒 δίπλα στη διεύθυνση και επίτρεψε το μικρόφωνο.',
        'service-not-allowed': 'Δεν δόθηκε άδεια για το μικρόφωνο.',
        'no-speech': 'Δεν ακούστηκε τίποτα. Πάτα ξανά και μίλα.',
        'audio-capture': 'Δεν βρέθηκε μικρόφωνο.',
        'network': 'Δεν υπάρχει σύνδεση στο internet για την αναγνώριση φωνής.'
      }[e.error] || ('Σφάλμα υπαγόρευσης: ' + e.error);
      setStatus(msg, true);
    };
    rec.onresult = function (e) {
      var finalText = '', interim = '';
      for (var i = e.resultIndex; i < e.results.length; i++) {
        var t = e.results[i][0].transcript;
        if (e.results[i].isFinal) finalText += t; else interim += t;
      }
      if (finalText) {
        baseText = (baseText ? baseText.replace(/\s+$/, '') + ' ' : '') + finalText.trim();
      }
      textEl.value = baseText + (interim ? (baseText ? ' ' : '') + interim : '');
    };

    micBtn.onclick = function () {
      if (listening) { rec.stop(); return; }
      setStatus('');
      baseText = textEl.value.trim();
      try { rec.start(); } catch (err) { /* ήδη σε λειτουργία */ }
    };
  }

  // Αν ο χρήστης διορθώσει με το χέρι, συνεχίζουμε από εκεί.
  textEl.addEventListener('input', function () { baseText = textEl.value; });

  document.getElementById('clear').onclick = function () {
    textEl.value = ''; baseText = ''; textEl.focus();
  };
  document.getElementById('cancel').onclick = function () { window.close(); };

  doneBtn.onclick = function () {
    if (rec && listening) rec.stop();
    var text = textEl.value.trim();
    if (!text) { setStatus('Δεν υπάρχει κείμενο.', true); return; }
    try {
      window.opener.postMessage({ type: 'tslot-voice', nonce: nonce, text: text }, returnOrigin);
      window.close();
    } catch (err) {
      setStatus('Δεν βρέθηκε η εφαρμογή TSLOT. Αντέγραψε το κείμενο με το χέρι.', true);
    }
  };

  // Ξεκινάμε αμέσως να ακούμε.
  if (rec && window.opener && originOk) micBtn.click();
})();
</script>
</body>
</html>
